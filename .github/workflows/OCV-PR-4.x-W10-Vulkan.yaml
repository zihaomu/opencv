name: OCV-PR-4.x-W10-Vulkan

on:
  pull_request:
    branches:
      - upstream_4x_back

concurrency:
  group: OCV-PR-4.x-W10-Vulkan-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTRA_CMAKE_OPTIONS: '-DWITH_VULKAN=ON -DCL_Z_OPTION=/Z7 -DOPENCV_DOWNLOAD_PATH=%BINARIES_CACHE% -DBUILD_EXAMPLES=ON -DOPENCV_ENABLE_NONFREE=ON -DCMAKE_BUILD_TYPE=Release -DWITH_OPENCL=OFF'
  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  PR_AUTHOR_FORK: ${{ github.event.pull_request.head.repo.full_name }}
  SOURCE_BRANCH_NAME: ${{ github.head_ref }}
  TARGET_BRANCH_NAME: ${{ github.base_ref }}
  OPENCV_TEST_DATA_PATH: '${{ github.workspace }}\opencv_extra\testdata'
  GTEST_FILTER_STRING: '-GOTURN.accuracy:DaSiamRPN.accuracy:NanoTrack.accuracy_NanoTrack_V2'
  OPENCV_VULKAN_RUNTIME: 'C:\VulkanSDK\1.3.239.0\Bin\vulkan-1.dll'
  DNN_MODELS: 'C:\Slave\workspace\dnn-models'

jobs:
  BuildAndTest:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Brief system information
        timeout-minutes: 60
        run: bash %GIT_CACHE%\print_system_information.sh
      - name: Setup infra environment
        timeout-minutes: 60
        if: ${{ github.event.repository.name == 'ci-gha-workflow' }}
        shell: bash
        run: echo "TARGET_BRANCH_NAME=4.x" >> $GITHUB_ENV
      - name: PR info
        timeout-minutes: 60
        run: |
         echo "PR Author: ${{ env.PR_AUTHOR }}"
         echo "PR Author fork: ${{ env.PR_AUTHOR_FORK }}"
         echo "Source branch name: ${{ env.SOURCE_BRANCH_NAME }}"
         echo "Target branch name: ${{ env.TARGET_BRANCH_NAME }}"
      - name: Clean
        timeout-minutes: 60
        run: cd ${{ github.workspace }} && rm -rf *
      - name: Fetch opencv
        timeout-minutes: 60
        run: cd ${{ github.workspace }} && git clone --branch ${{ env.TARGET_BRANCH_NAME }} --reference %GIT_CACHE%\opencv.git git@github.com:zihaomu/opencv.git
      - name: Merge opencv with ${{ env.SOURCE_BRANCH_NAME }} branch
        timeout-minutes: 60
        if: ${{ github.event.repository.name != 'ci-gha-workflow' }}
        run: |
         cd ${{ github.workspace }}\opencv
         git pull -v "git@github.com:${{ env.PR_AUTHOR_FORK }}" "${{ env.SOURCE_BRANCH_NAME }}"
      - name: Clone opencv_extra
        timeout-minutes: 60
        run: cd ${{ github.workspace }} && git clone --single-branch --branch 4.x --reference %GIT_CACHE%\opencv_extra.git git@github.com:opencv/opencv_extra.git
        working-directory: ${{ github.workspace }}
